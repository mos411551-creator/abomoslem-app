name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Prepare Clean Android Project
        run: |
          rm -rf android
          flutter create . --project-name=abomoslem_app --platforms=android --org=com.abomoslem --overwrite

          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              s = f.read()
          s = s.replace('flutter.minSdkVersion', '21')
          with open('android/app/build.gradle', 'w') as f:
              f.write(s)
          "

          cat << 'EOF' > pubspec.yaml
          name: abomoslem_app
          description: Abu Moslem App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.3+1
            path: ^1.9.0
            url_launcher: ^6.3.0
            excel: ^4.0.3
            path_provider: ^2.1.3
            share_plus: ^9.0.0
            file_picker: ^8.0.5
            intl: ^0.19.0
            pdf: ^3.11.0
            printing: ^5.13.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "app_icon.png"
          flutter:
            uses-material-design: true
          EOF

      - name: Build Application APK
        run: |
          flutter pub get
          if [ -f app_icon.png ]; then
            dart run flutter_launcher_icons || true
          fi
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abomoslem-app
          path: build/app/outputs/flutter-apk/*.apk
